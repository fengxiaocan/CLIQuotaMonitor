name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test (.NET 8 WPF)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore CLIQuotaMonitor.sln

    - name: Build Solution
      run: dotnet build CLIQuotaMonitor.sln -c Release --no-restore

    - name: Run Tests
      run: dotnet test CLIQuotaMonitor.sln -c Release --no-build --verbosity normal
